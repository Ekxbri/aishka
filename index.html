<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aishka Pro - Навчальний Асистент</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 20px; line-height: 1.5; font-size: 15px; }
        .user-msg { background-color: #238636; color: white; align-self: flex-end; border-bottom-right-radius: 5px; }
        .bot-msg { background-color: #21262d; border: 1px solid #30363d; align-self: flex-start; border-bottom-left-radius: 5px; }
        
        .input-area { background-color: #161b22; padding: 15px 20px; border-top: 1px solid #30363d; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #30363d; background-color: #0d1117; color: white; font-size: 15px; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #58a6ff; }
        button.send-btn { background-color: #238636; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.send-btn:hover { background-color: #2ea043; }
        
        .teacher-btn { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 12px; position: absolute; top: 15px; right: 20px; }
        .teacher-btn:hover { color: white; }

        #teacher-panel { display: none; background-color: #161b22; border-bottom: 1px solid #30363d; padding: 15px; gap: 10px; align-items: center; justify-content: center; }
        .teacher-input { padding: 8px 15px; border-radius: 15px; border: 1px solid #30363d; background-color: #0d1117; color: white; }
        .upload-btn { background-color: #1f6feb; color: white; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; }
        .upload-btn:hover { background-color: #388bfd; }
    </style>
</head>
<body>

    <button class="teacher-btn" onclick="openTeacher()">⚙️ Вчитель</button>

    <div id="teacher-panel">
        <input type="password" id="t-pass" class="teacher-input" placeholder="Пароль">
        <input type="text" id="t-subject" class="teacher-input" placeholder="Назва предмету (напр. Бази даних)">
        <input type="file" id="t-file" class="teacher-input" accept=".txt, .docx">
        <button class="upload-btn" onclick="uploadFile()">Завантажити базу</button>
    </div>

    <div class="chat-container" id="chat">
        <div class="message bot-msg">
            Привіт! Я Aishka Pro. 🎓<br><br>
            Ось як мною користуватися:<br>
            🔹 <b>Пошук:</b> <i>"Що таке моделювання?"</i> (коротка відповідь з бази)<br>
            🔹 <b>Детально:</b> <i>"Поняття моделювання детальніше"</i> (видам весь текст теми)<br>
            🔹 <b>Вижимка:</b> <i>"Головне по темі Класифікація моделей"</i> (лише основні тези)
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="question" placeholder="Напиши запитання..." onkeypress="if(event.key === 'Enter') sendQuestion()">
        <button class="send-btn" onclick="sendQuestion()">Відправити</button>
    </div>

    <script>
        function openTeacher() {
            let panel = document.getElementById("teacher-panel");
            panel.style.display = panel.style.display === "flex" ? "none" : "flex";
        }

        async function uploadFile() {
            let pass = document.getElementById("t-pass").value;
            let subject = document.getElementById("t-subject").value;
            let file = document.getElementById("t-file").files[0];

            if (!pass || !subject || !file) { alert("Заповніть всі поля!"); return; }

            let formData = new FormData();
            formData.append("password", pass);
            formData.append("subject", subject);
            formData.append("file", file);

            document.getElementById("chat").innerHTML += `<div class="message bot-msg"><i>⏳ Завантаження предмету '${subject}'...</i></div>`;
            
            try {
                let res = await fetch("/upload", { method: "POST", body: formData });
                let data = await res.json();
                document.getElementById("chat").innerHTML += `<div class="message bot-msg">${data.message}</div>`;
            } catch (e) {
                alert("Помилка завантаження!");
            }
        }

        async function sendQuestion() {
            let input = document.getElementById("question");
            let text = input.value.trim();
            if (!text) return;

            let chat = document.getElementById("chat");
            chat.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            let loadingId = "load-" + Date.now();
            chat.innerHTML += `<div class="message bot-msg" id="${loadingId}"><i>Шукаю...</i></div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                let res = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: text })
                });
                let data = await res.json();
                document.getElementById(loadingId).innerHTML = data.answer.replace(/\n/g, "<br>");
            } catch (e) {
                document.getElementById(loadingId).innerHTML = "Помилка зв'язку з сервером.";
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
