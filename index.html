<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aishka - Твій ШІ</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --ai-text-color: #cccccc;
            --user-msg-bg: #1a1a1a;
            --input-bg: #111111;
            --border-color: #333333;
            --success-color: #4ade80;
            --error-color: #f87171;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            height: 100%;
            position: relative;
        }

        .header {
            padding: 20px 24px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding-bottom: 120px;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .user-wrapper {
            align-items: flex-end;
        }

        .ai-wrapper {
            align-items: flex-start;
        }

        .message {
            max-width: 80%;
            line-height: 1.6;
            font-size: 1rem;
        }

        .user-msg {
            background-color: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 24px;
            border-top-right-radius: 4px;
        }

        .ai-msg {
            padding: 4px 0;
            color: var(--ai-text-color);
        }

        /* Поле вводу */
        .input-wrapper {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 800px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .icon-btn:hover {
            background-color: #222222;
        }

        .icon-btn svg {
            fill: #ffffff;
            width: 24px;
            height: 24px;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            padding: 10px 16px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #666666;
        }

        #fileInput {
            display: none;
        }

        .system-notice {
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #555555;
        }
        
        /* Скролбар для чорної теми */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            ⚫ Aishka
        </div>

        <div class="chat-container" id="chat">
            <div class="message-wrapper ai-wrapper">
                <div class="message ai-msg">
                    Привіт! Я Aishka. Звичайні користувачі можуть ставити мені питання. Адміністратор може завантажити нові теми через кнопку (+).
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <label for="fileInput" class="icon-btn" title="Завантажити конспект (Лише Адмін)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </label>
            <input type="file" id="fileInput" accept=".txt, .docx">
            
            <input type="text" id="question" placeholder="Напиши запитання..." onkeypress="if(event.key === 'Enter') ask()">
            
            <button class="icon-btn" onclick="ask()" title="Відправити">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 20V4l19 8-19 8zm2-3l11.85-5L5 7v3.5l6 1.5-6 1.5V17zm0 0V7v10z"/></svg>
            </button>
        </div>
        
        <div class="system-notice" id="upload-status">
            Aishka працює на базі твоїх конспектів.
        </div>
    </div>

    <script>
        // Зберігаємо авторизацію в пам'яті сторінки, щоб не вводити пароль двічі
        let adminAuthHeader = null;

        async function ask() {
            const input = document.getElementById('question');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, 'user-wrapper', 'user-msg');
            input.value = '';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: text })
                });
                const data = await response.json();
                addMessage(data.answer || data.error, 'ai-wrapper', 'ai-msg');
            } catch (e) {
                addMessage('Помилка з\'єднання із сервером.', 'ai-wrapper', 'ai-msg');
            }
        }

        function addMessage(text, wrapperClass, msgClass) {
            const chat = document.getElementById('chat');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${wrapperClass}`;
            
            const msg = document.createElement('div');
            msg.className = `message ${msgClass}`;
            msg.innerHTML = text.replace(/\n/g, '<br>');
            
            wrapper.appendChild(msg);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
        }

        // Обробка завантаження файлу з авторизацією
        document.getElementById('fileInput').addEventListener('change', async function() {
            if (this.files.length === 0) return;
            const file = this.files[0];
            const statusDiv = document.getElementById('upload-status');
            
            const formData = new FormData();
            formData.append("file", file);

            // Функція для спроби завантаження
            async function attemptUpload() {
                const headers = {};
                if (adminAuthHeader) {
                    headers['Authorization'] = adminAuthHeader;
                }

                statusDiv.textContent = `Відправка файлу ${file.name}...`;
                statusDiv.style.color = "var(--text-color)";

                const response = await fetch('/upload', { method: 'POST', headers: headers, body: formData });
                
                // Якщо сервер вимагає пароль (401 Unauthorized)
                if (response.status === 401) {
                    const username = prompt("Дія лише для адміністратора. Введіть логін:");
                    if (!username) return { error: "Завантаження скасовано." };
                    
                    const password = prompt("Введіть пароль:");
                    // Створюємо заголовок Basic Auth
                    adminAuthHeader = 'Basic ' + btoa(username + ':' + password);
                    
                    // Повторюємо спробу з новими даними
                    return attemptUpload();
                }
                
                return await response.json();
            }

            try {
                const data = await attemptUpload();
                if (data.detail || data.error) {
                    // Неправильний пароль
                    statusDiv.textContent = data.detail || data.error;
                    statusDiv.style.color = "var(--error-color)";
                    adminAuthHeader = null; // Скидаємо неправильний пароль
                } else {
                    // Успішне завантаження
                    statusDiv.textContent = data.message;
                    statusDiv.style.color = "var(--success-color)";
                }
            } catch (e) {
                statusDiv.textContent = "Помилка завантаження файлу.";
                statusDiv.style.color = "var(--error-color)";
            }
            
            // Очищаємо інпут, щоб можна було завантажити той самий файл ще раз
            this.value = '';
        });
    </script>
</body>
</html>
